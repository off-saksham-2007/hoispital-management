{% extends "base.html" %}
{% block title %}{{ 'Edit' if doctor else 'Add' }} Doctor{% endblock %}
{% block content %}
<h1>{{ 'Edit' if doctor else 'Add' }} Doctor</h1>
<form method="post" class="card card-body shadow-sm mt-3">
{{ csrf_input() }}
<div class="row g-3">
<div class="col-md-6"><label class="form-label">Doctor Name</label><input class="form-control" name="name" value="{{ doctor.name if doctor else '' }}" required></div>
<div class="col-md-6"><label class="form-label">Specialization</label><input class="form-control" name="specialization" value="{{ doctor.specialization if doctor else '' }}" required></div>
<div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ doctor.phone if doctor else '' }}"></div>
<div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" value="{{ doctor.email if doctor else '' }}"></div>
</div>
<div class="mt-4"><button class="btn btn-primary">Save</button> <a class="btn btn-secondary" href="{{ url_for('doctors') }}">Cancel</a></div>
</form>
{% endblock %}
