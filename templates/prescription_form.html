{% extends "base.html" %}
{% block title %}Add Prescription{% endblock %}
{% block content %}
<h1>Add Prescription</h1>
{% if not patients or not doctors %}<div class="alert alert-warning">Add at least one patient and one doctor first.</div>{% endif %}
<form method="post" class="card card-body shadow-sm mt-3">
{{ csrf_input() }}
<div class="row g-3">
<div class="col-md-6"><label class="form-label">Patient</label><select class="form-select" name="patient_id" required>{% for p in patients %}<option value="{{ p.id }}" {% if selected_patient_id == p.id %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Doctor</label><select class="form-select" name="doctor_id" required>{% for d in doctors %}<option value="{{ d.id }}">Dr. {{ d.name }} — {{ d.specialization }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Medicine</label><input class="form-control" name="medicine" placeholder="e.g. Paracetamol" required></div>
<div class="col-md-6"><label class="form-label">Dosage</label><input class="form-control" name="dosage" placeholder="e.g. 500 mg, twice daily" required></div>
<div class="col-12"><label class="form-label">Instructions</label><textarea class="form-control" name="instructions" rows="3" placeholder="After food, for 5 days..."></textarea></div>
</div>
<div class="mt-4"><button class="btn btn-primary" {% if not patients or not doctors %}disabled{% endif %}>Save Prescription</button> <a class="btn btn-secondary" href="{{ url_for('prescriptions') }}">Cancel</a></div>
</form>
{% endblock %}
