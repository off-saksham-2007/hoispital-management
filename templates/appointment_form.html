{% extends "base.html" %}
{% block title %}Book Appointment{% endblock %}
{% block content %}
<h1>Book Appointment</h1>
{% if not patients or not doctors %}
<div class="alert alert-warning">You need at least one patient and one doctor before booking an appointment.</div>
{% endif %}
<form method="post" class="card card-body shadow-sm mt-3">
{{ csrf_input() }}
<div class="row g-3">
<div class="col-md-6"><label class="form-label">Patient</label><select class="form-select" name="patient_id" required>
{% for p in patients %}<option value="{{ p.id }}">{{ p.name }} ({{ p.phone }})</option>{% endfor %}
</select></div>
<div class="col-md-6"><label class="form-label">Doctor</label><select class="form-select" name="doctor_id" required>
{% for d in doctors %}<option value="{{ d.id }}">Dr. {{ d.name }} — {{ d.specialization }}</option>{% endfor %}
</select></div>
<div class="col-md-6"><label class="form-label">Appointment Date & Time</label><input class="form-control" type="datetime-local" name="appointment_date" {% if selected_date %}value="{{ selected_date }}T09:00"{% endif %} required></div>
<div class="col-md-6"><label class="form-label">Reason</label><input class="form-control" name="reason" placeholder="e.g. Follow-up"></div>
</div>
<div class="mt-4"><button class="btn btn-primary" {% if not patients or not doctors %}disabled{% endif %}>Book Appointment</button> <a class="btn btn-secondary" href="{{ url_for('appointments') }}">Cancel</a></div>
</form>
{% endblock %}
