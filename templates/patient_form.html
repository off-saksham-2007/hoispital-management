{% extends "base.html" %}
{% block title %}{{ 'Edit' if patient else 'Register' }} Patient{% endblock %}
{% block content %}
<h1>{{ 'Edit' if patient else 'Register' }} Patient</h1>
<form method="post" class="card card-body shadow-sm mt-3">
{{ csrf_input() }}
<div class="row g-3">
<div class="col-md-6"><label class="form-label">Full Name</label><input class="form-control" name="name" value="{{ patient.name if patient else '' }}" required></div>
<div class="col-md-3"><label class="form-label">Age</label><input class="form-control" type="number" min="0" max="120" name="age" value="{{ patient.age if patient else '' }}" required></div>
<div class="col-md-3"><label class="form-label">Gender</label><select class="form-select" name="gender" required>
{% for g in ['Male','Female','Other'] %}<option {% if patient and patient.gender == g %}selected{% endif %}>{{ g }}</option>{% endfor %}
</select></div>
<div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ patient.phone if patient else '' }}" required></div>
<div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" value="{{ patient.email if patient else '' }}"></div>
<div class="col-12"><label class="form-label">Address</label><input class="form-control" name="address" value="{{ patient.address if patient else '' }}"></div>
</div>
<div class="mt-4"><button class="btn btn-primary">Save</button> <a class="btn btn-secondary" href="{{ url_for('patients') }}">Cancel</a></div>
</form>
{% endblock %}
